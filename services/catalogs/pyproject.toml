[project]
name = "spherex-catalogs"
version = "0.1.0"
description = "SPHEREx catalog service: name resolution, Gaia DR3 cone search and source detail."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    "astropy>=6.0",
]

[project.optional-dependencies]
live = [
    "astroquery>=0.4.7",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
